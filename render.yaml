services:
  - type: web
    name: gut-care-presentation
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      # Định tuyến SPA (Single Page Application) - chuyển mọi route về index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Tối ưu bộ nhớ đệm cho assets tĩnh (JS, CSS, hình ảnh)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
